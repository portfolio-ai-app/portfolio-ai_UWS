name: Update Market News

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest market news
        run: python scripts/fetch_news.py

      - name: Commit updated news
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "Update market news"
          git push
